<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">

  <div class="w-[520px] overflow-hidden bg-gray-300">

    <!-- Display -->
    <div class="bg-gray-600 text-white text-5xl px-10 py-8 flex items-center justify-end">
      0
    </div>

    <!-- Row 1 -->
    <div class="flex">
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">AC</button>
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">+/-</button>
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">%</button>
      <button class="flex-1 bg-orange-400 text-white h-24 text-2xl flex items-center justify-center">÷</button>
    </div>

    <!-- Row 2 -->
    <div class="flex">
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">7</button>
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">8</button>
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">9</button>
      <button class="flex-1 bg-orange-400 text-white h-24 text-2xl flex items-center justify-center">×</button>
    </div>

    <!-- Row 3 -->
    <div class="flex">
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">4</button>
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">5</button>
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">6</button>
      <button class="flex-1 bg-orange-400 text-white h-24 text-2xl flex items-center justify-center">−</button>
    </div>

    <!-- Row 4 -->
    <div class="flex">
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">1</button>
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">2</button>
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">3</button>
      <button class="flex-1 bg-orange-400 text-white h-24 text-2xl flex items-center justify-center">+</button>
    </div>

    <!-- Row 5 -->
    <div class="flex">
      <button class="flex-[2] bg-gray-200 h-24 text-2xl flex items-center justify-center">0</button>
      <button class="flex-1 bg-gray-200 h-24 text-2xl flex items-center justify-center">.</button>
      <button class="flex-1 bg-orange-400 text-white h-24 text-2xl flex items-center justify-center">=</button>
    </div>

  </div>

</body>
</html>
